<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Koperasi Modern</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono-numbers { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    
    /* Animasi transisi menu mobile */
    #mobile-menu {
      transition: all 0.3s ease-in-out;
    }
  </style>
</head>

<body class="bg-[#f8fafc] text-slate-900">

<div class="min-h-screen flex flex-col">

  <nav class="bg-[#0f172a] text-slate-300 sticky top-0 z-50 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
            <i data-lucide="landmark" class="w-5 h-5"></i>
          </div>
          <span class="text-lg font-bold tracking-tight text-white uppercase">Koperasi</span>
        </div>

        <div class="hidden lg:flex flex-1 justify-center px-8">
          <div class="flex items-baseline space-x-1">
            <a href="#" data-page="dashboard" class="px-3 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white flex items-center gap-2">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
            </a>
            <a href="#" data-page="anggota" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white flex items-center gap-2 transition-all">
              <i data-lucide="users" class="w-4 h-4"></i> Anggota
            </a>
            <a href="#" data-page="simpanan" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white flex items-center gap-2 transition-all">
              <i data-lucide="wallet" class="w-4 h-4"></i> Simpanan
            </a>
            <a href="#" data-page="pinjaman" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white flex items-center gap-2 transition-all">
              <i data-lucide="hand-coins" class="w-4 h-4"></i> Pinjaman
            </a>
            <a href="#" data-page="laporan" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white flex items-center gap-2 transition-all">
              <i data-lucide="file-text" class="w-4 h-4"></i> Laporan
            </a>
          </div>
        </div>

        <div class="hidden lg:flex items-center gap-4 border-l border-slate-700 pl-6">
          <div class="text-right">
            <span id="userName" class="text-xs font-bold text-white block leading-none">Memuat...</span>
            <span class="text-[10px] text-slate-500 uppercase">Admin</span>
          </div>
          <button id="btnLogout" class="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-500 hover:text-white rounded-lg transition-all border border-rose-500/20">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="lg:hidden flex items-center">
          <button id="menu-toggle" class="p-2 rounded-lg hover:bg-slate-800 focus:outline-none">
            <i data-lucide="menu" class="w-6 h-6" id="menu-icon"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="hidden lg:hidden bg-[#1e293b] border-t border-slate-700" id="mobile-menu">
      <div class="px-4 pt-2 pb-4 space-y-1">
        
        <a href="#" data-page="dashboard" class="block px-3 py-3 rounded-lg text-base font-semibold bg-indigo-600 text-white">Dashboard</a>
        <a href="#" data-page="anggota" class="block px-3 py-3 rounded-lg text-base font-medium hover:bg-slate-800">Anggota</a>
        <a href="#" data-page="simpanan" class="block px-3 py-3 rounded-lg text-base font-medium hover:bg-slate-800">Simpanan</a>
        <a href="#" data-page="pinjaman" class="block px-3 py-3 rounded-lg text-base font-medium hover:bg-slate-800">Pinjaman</a>
        <a href="#" data-page="laporan" class="block px-3 py-3 rounded-lg text-base font-medium hover:bg-slate-800 border-b border-slate-700 pb-4">Laporan</a>
        <div class="pt-4 flex items-center justify-between">
          <span class="text-sm font-bold text-white" id="userNameMobile">User</span>
          <button id="btnLogoutMobile" class="flex items-center gap-2 text-rose-500 font-bold text-sm">
            <i data-lucide="log-out" class="w-4 h-4"></i> LOGOUT
          </button>
        </div>
      </div>
    </div>
  </nav>
  <main id="app" class="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6 lg:p-8 space-y-8"></main>
 
</div>
<script>
  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  }
</script>
<script>
 

  // Logic Toggle Menu Mobile
  const menuToggle = document.getElementById('menu-toggle');
  const mobileMenu = document.getElementById('mobile-menu');
  const menuIcon = document.getElementById('menu-icon');

  menuToggle.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
    // Ganti ikon menu ke X saat terbuka
    const isHidden = mobileMenu.classList.contains('hidden');
    menuIcon.setAttribute('data-lucide', isHidden ? 'menu' : 'x');
    lucide.createIcons();
  });

  // Sinkronisasi Logout Mobile (Jika ada button khusus)
  const btnLogoutMobile = document.getElementById('btnLogoutMobile');
  if(btnLogoutMobile) {
    btnLogoutMobile.addEventListener('click', () => {
      document.getElementById('btnLogout').click();
    });
  }
</script>
<script type="module" src="./js/app.js"></script>

</body>
</html>
